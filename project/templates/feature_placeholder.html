<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <main class="main-content" style="margin-left: 0;">
    <header class="content-header">
      <h1>{{ title }}</h1>
      <p class="role-label">Здравствуйте, {{ username }}!</p>
    </header>
    <section class="submissions-panel">
      <h2>Раздел в разработке</h2>
      <p>Эта страница пока подготовлена как заглушка для тестирования переходов.</p>
      <a class="btn btn-blue" href="{{ dashboard_url }}" style="margin-top: 24px;">Вернуться в панель</a>
    </section>
  </main>
</body>
</html>
