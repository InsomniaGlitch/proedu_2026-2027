<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ-помощник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <rect width="1440" height="900" fill="#e5f2fc"/>
      <g fill="none" stroke-linecap="round">
        <path d="M-180 760C220 520 420 700 760 430 1100 160 1260 280 1620 40" stroke="#ffffff" stroke-width="210" opacity="0.92"/>
        <path d="M-220 900C180 680 460 860 820 590 1160 330 1320 460 1680 210" stroke="#f7fbff" stroke-width="120"/>
        <path d="M-140 560C240 340 470 500 800 250 1120 10 1300 120 1660 -80" stroke="#d4e7f8" stroke-width="150" opacity="0.95"/>
        <path d="M-200 1040C260 780 520 980 900 700 1240 450 1380 560 1720 340" stroke="#ffffff" stroke-width="160" opacity="0.8"/>
        <path d="M-80 420C280 220 520 360 840 140 1140 -60 1360 40 1700 -140" stroke="#edf6fd" stroke-width="90"/>
      </g>
    </svg>
  </div>

  <main class="login-page">
    <section class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="42" height="42" fill="#1d4ed8">
          <path d="M12 3L1 9L5 11.18V17.18L12 21L19 17.18V11.18L21 10.09V17H23V9L12 3ZM18.82 9L12 12.72L5.18 9L12 5.28L18.82 9ZM17 15.99L12 18.72L7 15.99V12.27L12 15L17 12.27V15.99Z"/>
        </svg>
      </div>

      <h1>ИИ-помощник</h1>
      <p class="subtitle">
        Ваш помощник в курсе<br>
        «Устойчивое развитие: системный подход»
      </p>

      <form id="login-form">
        <div class="field">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6.2 19.2c.8-3.2 3-4.8 5.8-4.8s5 1.6 5.8 4.8"/>
          </svg>
          <input id="username" name="username" type="text" placeholder="Введите логин" autocomplete="username" required>
        </div>

        <div class="field">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="10.5" width="12" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M8.5 10.5V8.2a3.5 3.5 0 0 1 7 0v2.3"/>
          </svg>
          <input id="password" name="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required>
          <button type="button" class="eye" id="toggle-password" aria-label="Показать пароль">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M2.8 12S6.2 6.8 12 6.8 21.2 12 21.2 12 17.8 17.2 12 17.2 2.8 12 2.8 12Z"/>
              <circle cx="12" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn btn-primary">Войти</button>
        <button type="button" class="btn btn-outline" onclick="window.location.href='/register'">Зарегистрироваться</button>
      </form>
    </section>
  </main>

  <script>
    const togglePassword = document.getElementById("toggle-password");
    const passwordInput = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
      const visible = passwordInput.type === "text";
      passwordInput.type = visible ? "password" : "text";
      togglePassword.classList.toggle("is-visible", !visible);
      togglePassword.setAttribute("aria-label", visible ? "Показать пароль" : "Скрыть пароль");
    });
  </script>
  <script src="/static/auth.js"></script>
</body>
</html>
