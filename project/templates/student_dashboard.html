<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная - Студент</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <!-- Боковое меню -->
    <aside class="sidebar">
      <div class="logo-area">
        <svg viewBox="0 0 24 24" width="42" height="42" fill="#1d4ed8">
          <path d="M12 3L1 9L5 11.18V17.18L12 21L19 17.18V11.18L21 10.09V17H23V9L12 3ZM18.82 9L12 12.72L5.18 9L12 5.28L18.82 9ZM17 15.99L12 18.72L7 15.99V12.27L12 15L17 12.27V15.99Z"/>
        </svg>
      </div>
      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item active">
          <span class="icon">🏠</span> Главная
        </a>
        <a href="/chat" class="nav-item">
          <span class="icon">💬</span> Чат с Tutor
        </a>
        <a href="/submissions" class="nav-item">
          <span class="icon">📄</span> Загрузка работы
        </a>
      </nav>
      <div class="nav-bottom">
        <a href="/login" onclick="logout(event)" class="nav-item">
          <span class="icon">🚪</span> Выйти
        </a>
      </div>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
      <header class="content-header">
        <h1>Здравствуйте, {{ username }}!</h1>
        <p class="role-label">Вы вошли как Студент</p>
      </header>

      <div class="cards-grid">
        <!-- Карточка 1: Чат -->
        <div class="action-card">
          <div class="card-icon">
            <svg viewBox="0 0 64 64" width="80" height="80">
              <path fill="#3b82f6" d="M52 12H12C8.7 12 6 14.7 6 18v24c0 3.3 2.7 6 6 6h8v10l12-10h20c3.3 0 6-2.7 6-6V18c0-3.3-2.7-6-6-6z"/>
              <circle cx="20" cy="30" r="3" fill="#fff"/>
              <circle cx="32" cy="30" r="3" fill="#fff"/>
              <circle cx="44" cy="30" r="3" fill="#fff"/>
            </svg>
          </div>
          <h2>Чат с ИИ-помощником<br>(Tutor)</h2>
          <p>Получите ответы на вопросы по материалам курса</p>
          <a href="/chat" class="btn btn-blue">Перейти в чат</a>
        </div>

        <!-- Карточка 2: Загрузка -->
        <div class="action-card green-theme">
          <div class="card-icon">
            <svg viewBox="0 0 64 64" width="80" height="80">
              <rect x="10" y="8" width="44" height="48" rx="4" fill="#fff" stroke="#22c55e" stroke-width="3"/>
              <path d="M22 24h20M22 32h20M22 40h12" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
              <circle cx="48" cy="48" r="14" fill="#22c55e"/>
              <path d="M48 40v16M40 48h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <h2>Загрузить работу<br>на проверку (Reviewer)</h2>
          <p>Проверьте вашу работу по чек-листу</p>
          <a href="/submissions" class="btn btn-green">Загрузить</a>
        </div>
      </div>
    </main>
  </div>
  <script>
    function logout(e) {
      e.preventDefault();
      fetch('/api/logout').then(() => window.location.href = '/login');
    }
  </script>
</body>
</html>
