
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commit Activity Calendar</title>
<style>
:root {
  --bg:#ffffff;
  --panel:#f6f8fa;
  --border:#d1d9e0;
  --text:#1f2328;
  --muted:#656d76;
  --link:#0969da;
  --levels:#ebedf0;
}
* {box-sizing:border-box}
body {
  margin:0;padding:24px;
  background:var(--bg);color:var(--text);
  font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main {max-width:1250px;margin:auto}
h1 {font-size:25px;margin:0 0 6px}
.subtitle {color:var(--muted);margin-bottom:22px}
.toolbar {
 display:flex;flex-wrap:wrap;gap:8px;margin:20px 0;
}
input,select,button {
 border:1px solid var(--border);border-radius:6px;
 background:white;color:var(--text);
 padding:9px 12px;font:inherit;
}
button {cursor:pointer}
button:hover {background:var(--panel)}
input {flex:1;min-width:170px}
.stats {
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:12px;margin:20px 0;
}
.stat {
 border:1px solid var(--border);border-radius:8px;
 padding:14px;background:white;
}
.stat strong {font-size:23px;display:block}
.stat span {color:var(--muted);font-size:12px}
.calendar-panel {
 border:1px solid var(--border);border-radius:9px;
 padding:18px;background:white;overflow:hidden;
}
.calendar-head {
 display:flex;justify-content:space-between;
 align-items:center;gap:12px;flex-wrap:wrap;
 margin-bottom:18px;
}
.calendar-head h2 {font-size:18px;margin:0}
.year-controls {display:flex;gap:6px;align-items:center}
#year {font-weight:600;min-width:50px;text-align:center}
.calendar-scroll {overflow-x:auto;padding-bottom:8px}
.calendar {
 display:grid;
 grid-template-columns:35px repeat(53,minmax(12px,1fr));
 gap:4px;min-width:760px;
}
.months {
 grid-column:2 / -1;
 display:grid;grid-template-columns:repeat(53,1fr);
 color:var(--muted);font-size:11px;
 height:17px;
}
.months span {white-space:nowrap}
.weekdays {
 display:grid;grid-template-rows:repeat(7,14px);
 gap:4px;color:var(--muted);font-size:10px;
}
.weeks {
 grid-column:2 / -1;
 display:grid;grid-template-columns:repeat(53,minmax(12px,1fr));
 gap:4px;
}
.week {
 display:grid;grid-template-rows:repeat(7,14px);gap:4px;
}
.cell {
 width:100%;height:14px;border-radius:3px;
 background:#ebedf0;border:1px solid #ffffff;
 padding:0;min-width:0;
}
.cell:hover {outline:2px solid #57606a}
.cell.selected {outline:2px solid #0969da}
.l0 {background:#ebedf0}
.l1 {background:#9be9a8}
.l2 {background:#40c463}
.l3 {background:#30a14e}
.l4 {background:#216e39}
.legend {
 display:flex;align-items:center;justify-content:flex-end;
 gap:4px;margin-top:15px;color:var(--muted);font-size:11px;
}
.legend .cell {width:13px;height:13px}
#status {margin:14px 0;color:var(--muted)}
.details {
 border:1px solid var(--border);border-radius:9px;
 margin-top:18px;overflow:hidden;
}
.details-head {
 padding:14px;background:var(--panel);
 display:flex;justify-content:space-between;gap:10px;
}
.details-head h3 {margin:0;font-size:15px}
table {border-collapse:collapse;width:100%}
th,td {
 padding:11px 12px;text-align:left;
 border-top:1px solid var(--border);
 vertical-align:top;
}
th {color:var(--muted);font-size:12px;background:#fafbfc}
a {color:var(--link);text-decoration:none}
a:hover {text-decoration:underline}
.sha {font-family:monospace;color:var(--muted);font-size:11px}
.empty {padding:24px;text-align:center;color:var(--muted)}
@media(max-width:650px) {
 body {padding:12px}
 .stats {grid-template-columns:repeat(2,1fr)}
 .calendar-panel {padding:12px}
 th,td {padding:8px 5px;font-size:12px}
}
</style>
</head>
<body>
<main>
<h1>📊 Активность</h1>
<div class="subtitle" id="repo">GitHub repository calendar</div>

<div class="stats">
 <div class="stat"><strong id="total">—</strong><span>Коммитов за год</span></div>
 <div class="stat"><strong id="days">—</strong><span>Активных дней</span></div>
 <div class="stat"><strong id="authors">—</strong><span>Авторов</span></div>
 <div class="stat"><strong id="branches">—</strong><span>Веток</span></div>
</div>

<div class="toolbar">
 <select id="branch"><option value="">Все ветки</option></select>
 <select id="author"><option value="">Все авторы</option></select>
 <input id="search" placeholder="Поиск по сообщениям...">
 <button id="refresh">↻ Обновить</button>
</div>

<div class="calendar-panel">
 <div class="calendar-head">
  <h2>Календарь коммитов</h2>
  <div class="year-controls">
   <button id="prev">←</button>
   <span id="year"></span>
   <button id="next">→</button>
  </div>
 </div>
 <div class="calendar-scroll">
  <div class="calendar">
   <div></div>
   <div class="months" id="months"></div>
   <div class="weekdays">
    <span></span><span>Пн</span><span></span>
    <span>Ср</span><span></span><span>Пт</span><span></span>
   </div>
   <div class="weeks" id="weeks"></div>
  </div>
 </div>
 <div class="legend">
  <span>Меньше</span>
  <span class="cell l0"></span>
  <span class="cell l1"></span>
  <span class="cell l2"></span>
  <span class="cell l3"></span>
  <span class="cell l4"></span>
  <span>Больше</span>
 </div>
</div>

<div id="status">Подготовка...</div>
<div class="details">
 <div class="details-head">
  <h3 id="selectedTitle">Выбери день в календаре</h3>
  <span id="selectedCount"></span>
 </div>
 <div id="commitList" class="empty">
  Нажми на любой день, чтобы увидеть коммиты.
 </div>
</div>
</main>

<script>
const OWNER = "InsomniaGlitch";
const REPO = "proedu_2026-2027";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;

let commits = [];
let selectedDay = "";
let selectedYear = new Date().getFullYear();

const $ = id => document.getElementById(id);

function dateKey(date) {
 return date.getFullYear()+"-"+
  String(date.getMonth()+1).padStart(2,"0")+"-"+
  String(date.getDate()).padStart(2,"0");
}

function safeDate(value) {
 return new Date(value);
}

async function getPages(url) {
 let all=[];
 while(url) {
  const r=await fetch(url,{
   headers:{"Accept":"application/vnd.github+json"}
  });
  if(!r.ok) {
   if(r.status===403 || r.status===429)
    throw Error("Лимит GitHub API исчерпан. Попробуйте позже.");
   throw Error("GitHub API: "+r.status);
  }
  all.push(...await r.json());
  const link=r.headers.get("Link")||"";
  const next=link.match(/<([^>]+)>;\s*rel="next"/);
  url=next?next[1]:null;
 }
 return all;
}

async function loadData() {
 $("status").textContent="Загружаем ветки...";
 $("commitList").textContent="Загрузка...";
 try {
  const branches=await getPages(
   `${API}/branches?per_page=100`
  );
  if(!branches.length) throw Error("Ветки не найдены.");

  const unique=new Map();

  for(let i=0;i<branches.length;i++) {
   const b=branches[i];
   $("status").textContent=
    `Загрузка ${b.name}: ${i+1}/${branches.length}`;

   const list=await getPages(
    `${API}/commits?sha=${encodeURIComponent(b.name)}&per_page=100`
   );

   for(const c of list) {
    if(!unique.has(c.sha)) {
     unique.set(c.sha,{
      sha:c.sha,
      message:c.commit.message.split("\n")[0],
      date:c.commit.author?.date||c.commit.committer?.date,
      author:c.author?.login||c.commit.author?.name||"Unknown",
      url:c.html_url,
      branches:[]
     });
    }
    const item=unique.get(c.sha);
    if(!item.branches.includes(b.name))
     item.branches.push(b.name);
   }
  }

  commits=[...unique.values()];
  $("repo").textContent=`${OWNER}/${REPO} · ${branches.length} веток`;

  populateFilters();
  render();
 } catch(e) {
  $("status").textContent="Ошибка: "+e.message;
  $("commitList").textContent="Не удалось загрузить данные.";
 }
}

function populateFilters() {
 const branch=$("branch");
 const author=$("author");
 branch.innerHTML='<option value="">Все ветки</option>';
 author.innerHTML='<option value="">Все авторы</option>';

 [...new Set(commits.flatMap(c=>c.branches))]
  .sort().forEach(x=>{
   const o=document.createElement("option");
   o.value=x;o.textContent=x;branch.appendChild(o);
  });

 [...new Set(commits.map(c=>c.author))]
  .sort().forEach(x=>{
   const o=document.createElement("option");
   o.value=x;o.textContent=x;author.appendChild(o);
  });
}

function filtered() {
 const b=$("branch").value;
 const a=$("author").value;
 const s=$("search").value.toLowerCase();
 return commits.filter(c=>
  (!b||c.branches.includes(b)) &&
  (!a||c.author===a) &&
  (!s||(c.message+" "+c.sha).toLowerCase().includes(s))
 );
}

function level(n,max) {
 if(!n)return 0;
 if(max<=1)return 4;
 const ratio=n/max;
 if(ratio<=.25)return 1;
 if(ratio<=.5)return 2;
 if(ratio<=.75)return 3;
 return 4;
}

function render() {
 const data=filtered();
 const yearData=data.filter(c=>
  safeDate(c.date).getFullYear()===selectedYear
 );
 const map={};
 yearData.forEach(c=>{
  const k=dateKey(safeDate(c.date));
  (map[k] ||= []).push(c);
 });

 const values=Object.values(map).map(x=>x.length);
 const max=Math.max(1,...values);

 $("year").textContent=selectedYear;
 $("total").textContent=yearData.length;
 $("days").textContent=Object.keys(map).length;
 $("authors").textContent=new Set(yearData.map(c=>c.author)).size;
 $("branches").textContent=new Set(yearData.flatMap(c=>c.branches)).size;

 const start=new Date(selectedYear,0,1);
 const end=new Date(selectedYear,11,31);
 const mondayOffset=(start.getDay()+6)%7;
 const first=new Date(selectedYear,0,1-mondayOffset);
 const totalWeeks=Math.ceil((end-first+86400000)/604800000);

 const months=$("months");
 const weeks=$("weeks");
 months.innerHTML="";
 weeks.innerHTML="";

 const monthNames=["Янв","Фев","Мар","Апр","Май","Июн",
  "Июл","Авг","Сен","Окт","Ноя","Дек"];

 for(let m=0;m<12;m++) {
  const d=new Date(selectedYear,m,1);
  const index=Math.floor((d-first)/604800000);
  const span=document.createElement("span");
  span.textContent=monthNames[m];
  span.style.gridColumnStart=index+1;
  months.appendChild(span);
 }

 for(let w=0;w<totalWeeks;w++) {
  const col=document.createElement("div");
  col.className="week";
  for(let d=0;d<7;d++) {
   const date=new Date(first);
   date.setDate(first.getDate()+w*7+d);
   const k=dateKey(date);
   const n=map[k]?.length||0;
   const cell=document.createElement("button");
   cell.className="cell l"+level(n,max);
   cell.title=`${k}: ${n} коммитов`;
   if(date.getFullYear()!==selectedYear) {
    cell.style.visibility="hidden";
   }
   if(k===selectedDay)cell.classList.add("selected");
   cell.onclick=()=>{
    selectedDay=k;
    render();
    showDay(k,map[k]||[]);
   };
   col.appendChild(cell);
  }
  weeks.appendChild(col);
 }

 $("status").textContent=
  `${yearData.length} коммитов · ${Object.keys(map).length} активных дней`;

 if(selectedDay) {
  showDay(selectedDay,map[selectedDay]||[]);
 }
}

function showDay(key,items) {
 $("selectedTitle").textContent=key;
 $("selectedCount").textContent=items.length+" коммитов";
 const root=$("commitList");
 root.innerHTML="";

 if(!items.length) {
  root.className="empty";
  root.textContent="В этот день коммитов нет.";
  return;
 }

 root.className="";
 const table=document.createElement("table");
 table.innerHTML="<thead><tr><th>Время</th><th>Автор</th><th>Ветка</th><th>Коммит</th></tr></thead>";
 const body=document.createElement("tbody");

 items.sort((a,b)=>new Date(b.date)-new Date(a.date));

 items.forEach(c=>{
  const tr=document.createElement("tr");
  const values=[
   safeDate(c.date).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),
   c.author,c.branches.join(", ")
  ];
  values.forEach(v=>{
   const td=document.createElement("td");
   td.textContent=v;
   tr.appendChild(td);
  });

  const td=document.createElement("td");
  const a=document.createElement("a");
  a.href=c.url;a.target="_blank";a.rel="noopener";
  a.textContent=c.message||"(без сообщения)";
  td.appendChild(a);
  const sha=document.createElement("div");
  sha.className="sha";
  sha.textContent=c.sha.slice(0,7);
  td.appendChild(sha);
  tr.appendChild(td);
  body.appendChild(tr);
 });
 table.appendChild(body);
 root.appendChild(table);
}

$("prev").onclick=()=>{selectedYear--;selectedDay="";render()};
$("next").onclick=()=>{selectedYear++;selectedDay="";render()};
$("refresh").onclick=loadData;
$("branch").onchange=render;
$("author").onchange=render;
$("search").oninput=render;

loadData();
</script>
</body>
</html>
