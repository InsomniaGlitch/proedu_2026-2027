services:
  langflow:
    image: tutor-langflow:local
    build:
      context: .
      dockerfile: Dockerfile.tutor
    # Единый .env (см. .env.example). Старый .env.tutor по-прежнему подхватывается, если есть.
    env_file:
      - path: .env
        required: false
      - path: .env.tutor
        required: false
    environment:
      LANGFLOW_COMPONENTS_PATH: /app/langflow/custom_components
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./custom_components:/app/langflow/custom_components:ro
